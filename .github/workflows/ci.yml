name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET workloads
        run: dotnet workload restore OpenGarrison.sln

      - name: Restore solution
        run: dotnet restore OpenGarrison.sln

      - name: Restore browser build graph
        run: >
          dotnet restore Client.Browser/OpenGarrison.Client.Browser.csproj
          -p:OpenGarrisonClientAsLibrary=true

      - name: Build solution
        run: >
          dotnet build OpenGarrison.sln
          --configuration Debug
          --no-restore
          -p:OpenGarrisonPackageScriptOwnsContent=true

      - name: Run networking tests
        run: >
          dotnet test Tests/OpenGarrison.Networking.Tests/OpenGarrison.Networking.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore

      - name: Run gameplay and plugin-host tests
        run: >
          dotnet test Tests/OpenGarrison.PluginHost.Tests/OpenGarrison.PluginHost.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore

  bot-score-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build BotBrain tools
        run: dotnet build BotBrain.Tools/OpenGarrison.BotBrain.Tools.csproj --configuration Debug

      - name: Run BotBrain navigation smoke
        run: >
          dotnet BotBrain.Tools/bin/Debug/net10.0/OpenGarrison.BotBrain.Tools.dll
          --dump-room-objects true
          --map Harvest
          --area 1
          --team Red
