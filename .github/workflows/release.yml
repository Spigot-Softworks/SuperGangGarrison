on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to stamp into packages, for example 1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release identity
        id: release
        shell: pwsh
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $tag = $env:EVENT_TAG
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $tag
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'A release version is required.'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = if ($version.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $version
            } else {
              "v$version"
            }
          }
          if ($tag -notmatch '^v?[0-9]+(?:\.[0-9]+)+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag '$tag' is not a supported version tag."
          }
          $escapedTag = [System.Uri]::EscapeDataString($tag)
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset_base_url=https://github.com/${{ github.repository }}/releases/download/$escapedTag" >> $env:GITHUB_OUTPUT

      - name: Install Linux MsQuic native dependency
        run: |
          if ! apt-cache show libmsquic >/dev/null 2>&1; then
            ubuntu_version="$(. /etc/os-release && printf '%s' "$VERSION_ID")"
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/${ubuntu_version}/packages-microsoft-prod.deb" -o /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update
          fi
          sudo apt-get install -y libmsquic
          ldconfig -p | grep -E 'libmsquic\.so'

      - name: Run protocol-64 networking tests
        run: |
          dotnet test Tests/OpenGarrison.Networking.Tests/OpenGarrison.Networking.Tests.csproj --configuration Release --verbosity minimal
          dotnet test Tests/OpenGarrison.PluginHost.Tests/OpenGarrison.PluginHost.Tests.csproj --configuration Release --filter "FullyQualifiedName~Protocol64" --verbosity minimal

      - name: Verify packaged-content policy tests
        shell: pwsh
        run: ./scripts/verify-packaged-content.ps1 -SelfTest

      - name: Run updater transaction tests
        run: dotnet test Tests/OpenGarrison.Updater.Tests/OpenGarrison.Updater.Tests.csproj --configuration Release --verbosity minimal

      - name: Fetch currently published packages for incremental updates
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/fetch-update-delta-bases.ps1 `
            -Platforms @("linux-x64", "win-x64") `
            -Channel stable `
            -OutputDirectory ./dist/delta-bases `
            -GitHubRepository "${{ github.repository }}" `
            -ExcludeReleaseTag "${{ steps.release.outputs.tag }}" `
            -Required

      - name: Package Linux and Windows
        shell: pwsh
        run: |
          $platforms = @("linux-x64", "win-x64")
          ./scripts/package.ps1 `
            -Platforms $platforms `
            -Version "${{ steps.release.outputs.version }}" `
            -DeltaBaseDirectory ./dist/delta-bases `
            -UpdateAssetBaseUrl "${{ steps.release.outputs.asset_base_url }}" `
            -RequireDeltas

      - name: Verify distribution archives
        shell: pwsh
        run: |
          ./scripts/verify-package.ps1 -RuntimeIdentifier linux-x64 -ArchivePath ./dist/OpenGarrison-Linux-x64.tar.gz
          ./scripts/verify-package.ps1 -RuntimeIdentifier win-x64 -ArchivePath ./dist/OpenGarrison-Windows-x64.zip

          $updaterAssembly = (Resolve-Path ./Updater/bin/Release/net10.0/OG2.Updater.dll).Path
          $winBase = Get-ChildItem ./dist/delta-bases/win-x64 -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name.EndsWith('.zip', [System.StringComparison]::OrdinalIgnoreCase) } |
            Select-Object -First 1
          $linuxBase = Get-ChildItem ./dist/delta-bases/linux-x64 -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name.EndsWith('.tar.gz', [System.StringComparison]::OrdinalIgnoreCase) -or $_.Name.EndsWith('.tgz', [System.StringComparison]::OrdinalIgnoreCase) } |
            Select-Object -First 1

          $winDeltas = @(Get-ChildItem ./dist -File -Filter '*.delta.zip')
          $linuxDeltas = @(Get-ChildItem ./dist -File -Filter '*.delta.tar.gz')
          if ($winDeltas.Count -eq 0 -or $linuxDeltas.Count -eq 0) {
            throw 'Every release must contain verified Windows and Linux delta packages.'
          }

          $winDeltas | ForEach-Object {
            if ($null -eq $winBase) { throw 'A Windows delta was generated without its base archive.' }
            ./scripts/verify-update-delta.ps1 -RuntimeIdentifier win-x64 -ArchivePath $_.FullName -BaseArchivePath $winBase.FullName -UpdaterAssemblyPath $updaterAssembly
          }
          $linuxDeltas | ForEach-Object {
            if ($null -eq $linuxBase) { throw 'A Linux delta was generated without its base archive.' }
            ./scripts/verify-update-delta.ps1 -RuntimeIdentifier linux-x64 -ArchivePath $_.FullName -BaseArchivePath $linuxBase.FullName -UpdaterAssemblyPath $updaterAssembly
          }

      - name: Prepare release manifests
        shell: pwsh
        run: |
          $manifests = @(
            @{
              Source = './services/opengarrison-api/updates/windows-x64/stable/latest.json'
              Destination = './dist/OpenGarrison-Windows-x64.latest.json'
            },
            @{
              Source = './services/opengarrison-api/updates/linux-x64/stable/latest.json'
              Destination = './dist/OpenGarrison-Linux-x64.latest.json'
            }
          )
          foreach ($item in $manifests) {
            $manifest = Get-Content -LiteralPath $item.Source -Raw | ConvertFrom-Json
            if ([int]$manifest.schemaVersion -lt 2 -or @($manifest.deltas).Count -eq 0) {
              throw "Release manifest '$($item.Source)' does not advertise a delta."
            }
            foreach ($package in @($manifest.fullPackage) + @($manifest.deltas)) {
              if ([string]::IsNullOrWhiteSpace([string]$package.url) -or
                  -not ([string]$package.url).StartsWith("${{ steps.release.outputs.asset_base_url }}/", [System.StringComparison]::Ordinal)) {
                throw "Release manifest '$($item.Source)' contains an unpinned package URL."
              }
            }
            Copy-Item -LiteralPath $item.Source -Destination $item.Destination -Force
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/OpenGarrison-Linux-x64.tar.gz
            dist/OpenGarrison-Windows-x64.zip
            dist/*.delta.zip
            dist/*.delta.tar.gz
            dist/OpenGarrison-Linux-x64.latest.json
            dist/OpenGarrison-Windows-x64.latest.json
