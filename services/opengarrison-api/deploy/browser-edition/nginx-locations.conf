# Verified run uploads (same API HTTPS server block).
location /api/last-to-die/recordings {
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
}

# Merge into the existing HTTPS api.superganggarrison.com server block.
# Do not log query strings: WebSocket URLs contain short-lived admission tokens.
location /api/peer-rooms/ {
    proxy_pass http://127.0.0.1:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    client_max_body_size 16k;
    access_log off;
}

# Retain this route only for older managed-room clients.
location /api/private-rooms/ {
    proxy_pass http://127.0.0.1:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    client_max_body_size 8k;
    access_log off;
}

